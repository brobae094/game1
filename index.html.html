<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163e50">
<meta name="description" content="재단법인 맑고푸른곶의 사업과 활동을 탐험하는 인터랙티브 환경 마을">
<title>맑고푸른곶 월드 | 환경 마을 탐험</title>
<style>
:root{--ink:#17394a;--green:#287b65;--cream:#f6f4e9;--line:#d9e5df;--shadow:0 18px 55px #1233442b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#d9e9dc}
button{font:inherit;cursor:pointer}
#game{position:relative;width:100%;height:100%;min-height:520px;background:linear-gradient(#c9e3dc,#e6edcf)}
canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
.hud{position:absolute;z-index:3;left:22px;right:22px;top:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand,.mission,.sound,.map-btn{pointer-events:auto;box-shadow:0 8px 25px #17394a18}
.brand{display:flex;align-items:center;gap:11px;background:#fffffff0;border:1px solid #ffffff;border-radius:17px;padding:10px 15px}
.brand-mark{width:37px;height:37px;border-radius:12px;background:linear-gradient(145deg,#4eaa83,#1d5369);display:grid;place-items:center;color:white;font-size:21px}
.brand strong{display:block;font-size:15px;letter-spacing:-.5px}.brand small{display:block;color:#71858b;font-size:9px;letter-spacing:1.7px;font-weight:800;margin-top:2px}
.hud-right{display:flex;gap:8px;align-items:center}
.pill{border:1px solid #ffffff;background:#fffffff0;color:#24495a;border-radius:999px;padding:11px 15px;font-size:12px;font-weight:800;box-shadow:0 8px 25px #17394a18}
.pill span{color:#34856b;margin-right:5px}
.title-card{position:absolute;z-index:2;left:50%;top:105px;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(90%,560px);text-shadow:0 2px 10px #ffffff80}
.title-card .eyebrow{font-size:10px;letter-spacing:3px;color:#397b68;font-weight:900}
.title-card h1{font-size:clamp(25px,4vw,43px);letter-spacing:-1.8px;margin:7px 0 5px;color:#17445a}
.title-card p{margin:0;font-size:13px;color:#42666b;font-weight:600}
.bottom-hud{position:absolute;z-index:4;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;align-items:end;gap:14px;pointer-events:none}
.guide{pointer-events:auto;background:#fffffff0;border:1px solid white;border-radius:16px;padding:12px 16px;box-shadow:0 8px 25px #17394a18;max-width:440px;display:flex;gap:11px;align-items:center}
.guide-icon{width:36px;height:36px;border-radius:12px;background:#e4f1e8;display:grid;place-items:center;font-size:20px;flex:none}
.guide strong{font-size:12px;display:block}.guide p{margin:2px 0 0;font-size:11px;color:#667c7c;line-height:1.45}
.controls{pointer-events:auto;display:flex;gap:8px;align-items:end}
.keys{background:#ffffffdf;border:1px solid white;border-radius:14px;padding:9px 12px;text-align:center;color:#557078;font-size:10px;line-height:1.6}
.keys b{display:block;color:#234c5b;font-size:12px;letter-spacing:2px}
.dpad{display:none;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:3px;pointer-events:auto}
.dpad button{border:1px solid #ffffff;background:#fffffff0;border-radius:11px;color:#1e4d5c;font-size:17px;box-shadow:0 5px 15px #17394a20}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.dpad .up{grid-row:1}
.interact-hint{position:absolute;z-index:3;left:50%;bottom:105px;transform:translateX(-50%);background:#173f50eF;color:#fff;padding:9px 15px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 7px 20px #16394a35;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.interact-hint.show{opacity:1}
.modal-backdrop{position:absolute;z-index:10;inset:0;background:#102d3d80;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
.modal-backdrop.open{display:flex}
.modal{width:min(100%,540px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 25px 80px #102d3d55;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-visual{height:155px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#c9e6d4,#e8edcf);font-size:70px}
.modal-visual:after{content:"";position:absolute;inset:auto 0 0;height:55px;background:linear-gradient(transparent,#fff)}
.modal-content{padding:4px 27px 26px}
.modal-kicker{font-size:10px;letter-spacing:2px;color:#32836b;font-weight:900}
.modal h2{font-size:27px;letter-spacing:-1px;margin:6px 0 10px;color:#183f52}
.modal p{font-size:14px;color:#60767b;line-height:1.8;margin:0 0 18px}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap}
.action{border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:13px;background:#1b5365;color:#fff}
.action.secondary{background:#edf4f0;color:#285a50}
.close{position:absolute;right:16px;top:14px;border:0;background:#ffffffd9;border-radius:50%;width:34px;height:34px;font-size:20px;color:#214a58}
.toast{position:absolute;z-index:5;left:50%;top:20px;transform:translate(-50%,-15px);opacity:0;transition:.25s;background:#173f50;color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.map-legend{position:absolute;right:22px;bottom:105px;z-index:2;background:#ffffffdf;border:1px solid white;border-radius:13px;padding:10px 12px;font-size:10px;color:#587276;line-height:1.7}
.map-legend b{color:#285a50}
@media(max-width:700px){
 .hud{left:12px;right:12px;top:12px}.brand{padding:8px 10px}.brand-mark{width:32px;height:32px}.brand strong{font-size:13px}
 .hud-right .pill:nth-child(2){display:none}.pill{padding:9px 11px;font-size:11px}
 .title-card{top:82px}.title-card p{font-size:11px}
 .bottom-hud{left:12px;right:12px;bottom:12px}.guide{padding:9px 11px;max-width:calc(100% - 120px)}.guide p{font-size:10px}
 .keys{display:none}.dpad{display:grid}.map-legend{display:none}
 .interact-hint{bottom:145px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="game">
 <canvas id="world" aria-label="방향키 또는 WASD로 캐릭터를 움직이며 마을을 탐험하는 게임 화면"></canvas>
 <div class="hud">
  <a class="brand" href="#" aria-label="맑고푸른곶 월드 홈">
   <span class="brand-mark">🌿</span><span><strong>맑고푸른곶 월드</strong><small>CLEAR & BLUE FOUNDATION</small></span>
  </a>
  <div class="hud-right">
   <div class="pill"><span>●</span> 환경 마을 탐험 중</div>
   <button class="pill map-btn" id="helpBtn">조작 안내 ?</button>
  </div>
 </div>
 <div class="title-card">
  <div class="eyebrow">WELCOME TO THE ECO VILLAGE</div>
  <h1>맑고 푸른 내일을 탐험해요</h1>
  <p>마을을 걸어 다니며 맑고푸른곶의 이야기를 만나보세요.</p>
 </div>
 <div class="interact-hint" id="interactHint">SPACE 또는 ENTER 를 눌러 살펴보기</div>
 <div class="map-legend"><b>마을 안내</b><br>🏢 재단 본부　🔬 연구센터<br>🏫 교육센터　🌊 환경 보전</div>
 <div class="bottom-hud">
  <div class="guide"><div class="guide-icon">🧭</div><div><strong id="guideTitle">탐험을 시작해 보세요!</strong><p id="guideText">방향키 또는 WASD로 캐릭터를 움직여 건물 가까이 가보세요.</p></div></div>
  <div class="controls">
   <div class="keys"><b>↑ ↓ ← →</b>이동　·　SPACE 상호작용</div>
   <div class="dpad" aria-label="터치 이동 버튼">
    <button class="up" data-dir="up" aria-label="위로">▲</button>
    <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
    <button class="down" data-dir="down" aria-label="아래로">▼</button>
    <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
   </div>
  </div>
 </div>
 <div class="toast" id="toast"></div>
 <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
   <div class="modal-visual" id="modalVisual"><span id="modalEmoji">🏢</span><button class="close" id="closeModal" aria-label="닫기">×</button></div>
   <div class="modal-content">
    <div class="modal-kicker" id="modalKicker">FOUNDATION</div>
    <h2 id="modalTitle">재단 본부</h2>
    <p id="modalText"></p>
    <div class="modal-actions"><button class="action" id="moreBtn">자세히 알아보기 ↗</button><button class="action secondary" id="backBtn">마을로 돌아가기</button></div>
   </div>
  </div>
 </div>
</div>
<script>
(() => {
 const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
 const hint=document.getElementById('interactHint'),guideTitle=document.getElementById('guideTitle'),guideText=document.getElementById('guideText');
 const backdrop=document.getElementById('modalBackdrop'),toast=document.getElementById('toast');
 const buildings=[
  {id:'about',name:'재단 본부',emoji:'🏢',x:0,y:-145,color:'#e9d7b5',roof:'#4d7880',kicker:'ABOUT FOUNDATION',desc:'재단의 설립 목적과 운영 방향, 인사말과 조직 등 맑고푸른곶을 소개하는 공간입니다. 자연과 사람, 지역사회가 함께하는 지속가능한 미래를 향한 재단의 이야기를 만나보세요.',detail:'재단소개 메뉴 연결 위치입니다. 실제 홈페이지의 인사말·설립목적·연혁·조직도 페이지 URL로 교체해 주세요.',url:'#foundation'},
  {id:'research',name:'환경 연구센터',emoji:'🔬',x:190,y:-40,color:'#d9e8dc',roof:'#438b7a',kicker:'RESEARCH & DATA',desc:'환경과 생태에 관한 조사와 연구, 자료 분석을 소개합니다. 정확한 정보와 전문적인 연구를 바탕으로 더 나은 환경을 위한 방향을 모색합니다.',detail:'실제 재단의 연구·조사 사업 및 관련 성과 자료를 연결해 주세요.',url:'#business'},
  {id:'education',name:'환경 교육센터',emoji:'🏫',x:170,y:150,color:'#f1dfb9',roof:'#c18c52',kicker:'EDUCATION & COMMUNITY',desc:'환경의 소중함을 배우고 함께 실천하는 교육과 지역 협력의 공간입니다. 다양한 참여와 소통을 통해 환경 가치를 널리 나눕니다.',detail:'실제 교육사업·캠페인·지역협력 콘텐츠를 연결해 주세요.',url:'#business'},
  {id:'coast',name:'환경 보전 기지',emoji:'🌊',x:-190,y:55,color:'#d9e8ed',roof:'#4d91a0',kicker:'NATURE CONSERVATION',desc:'소중한 자연환경과 생태계를 지키기 위한 보전 활동을 소개합니다. 지속가능한 환경을 위한 재단의 활동과 현장을 둘러보세요.',detail:'실제 환경 보전 사업 및 활동 기록 페이지로 연결해 주세요.',url:'#business'}
 ];
 const state={x:0,y:100,dir:'down',moving:false,keys:{},last:0,near:null,modal:null,frame:0};
 let W=0,H=0,dpr=1,scale=1,camX=0,camY=0;
 const iso=(x,y)=>({x:(x-y)*.866*scale,y:(x+y)*.5*scale});
 function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/950,H/650,1.18);if(W<600)scale*=.91}
 addEventListener('resize',resize);resize();
 function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
 function diamond(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.moveTo(x,y-ry);ctx.lineTo(x+rx,y);ctx.lineTo(x,y+ry);ctx.lineTo(x-rx,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
 function worldPoint(x,y){const p=iso(x,y);return{x:W/2+p.x-camX,y:H/2+p.y-camY+20}}
 function drawTree(x,y,s=1){const p=worldPoint(x,y);ctx.save();ctx.translate(p.x,p.y);ctx.scale(s*scale,s*scale);
  ctx.fillStyle='#00000018';ctx.beginPath();ctx.ellipse(0,7,19,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#805c42';ctx.fillRect(-4,-16,8,23);
  [[0,-35,18,'#367c59'],[-12,-25,14,'#4b9568'],[12,-23,14,'#2e704f'],[0,-48,13,'#5aa477']].forEach(a=>{ctx.beginPath();ctx.arc(a[0],a[1],a[2],0,Math.PI*2);ctx.fillStyle=a[3];ctx.fill()});
  ctx.restore()}
 function drawBush(x,y){const p=worldPoint(x,y);ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale,scale);ctx.fillStyle='#4f9668';ctx.beginPath();ctx.arc(-6,-4,8,0,7);ctx.arc(5,-6,10,0,7);ctx.arc(12,0,7,0,7);ctx.fill();ctx.restore()}
 function drawBuilding(b){
  const p=worldPoint(b.x,b.y),s=scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
  // shadow
  ctx.fillStyle='#254e3b25';ctx.beginPath();ctx.ellipse(0,8,67,25,0,0,Math.PI*2);ctx.fill();
  // steps and base
  diamond(0,0,62,29,'#d6cba9','#b8b18f');
  // walls
  ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(-43,-24);ctx.lineTo(0,-2);ctx.lineTo(43,-24);ctx.lineTo(43,-74);ctx.lineTo(0,-96);ctx.lineTo(-43,-74);ctx.closePath();ctx.fill();ctx.strokeStyle='#7b8d7d';ctx.stroke();
  // side shade
  ctx.fillStyle='#b9cbbd';ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(43,-24);ctx.lineTo(43,-74);ctx.lineTo(0,-51);ctx.closePath();ctx.fill();
  // roof
  ctx.fillStyle=b.roof;ctx.beginPath();ctx.moveTo(-52,-73);ctx.lineTo(0,-104);ctx.lineTo(52,-73);ctx.lineTo(0,-43);ctx.closePath();ctx.fill();ctx.strokeStyle='#345d5b';ctx.stroke();
  ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.moveTo(-52,-73);ctx.lineTo(0,-104);ctx.lineTo(0,-91);ctx.lineTo(-30,-72);ctx.closePath();ctx.fill();
  // door and windows
  ctx.fillStyle='#6c6654';ctx.fillRect(-9,-42,18,39);ctx.fillStyle='#b6d7d7';ctx.fillRect(-34,-58,13,17);ctx.fillRect(20,-58,13,17);
  ctx.fillStyle='#ffffff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(b.emoji,0,-70);
  // label
  roundRect(-48,-133,96,22,8,'#ffffffed','#dbe6dc');ctx.fillStyle='#234b55';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(b.name,0,-119);
  if(state.near===b){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.ellipse(0,-2,68,32,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
  ctx.restore()
 }
 function drawPath(){
  // pale winding paths between central plaza and facilities
  const pts=[[-330,230],[-210,140],[-80,80],[0,100],[90,40],[220,-50],[330,-130]];
  ctx.beginPath();pts.forEach((v,i)=>{const p=worldPoint(v[0],v[1]);if(!i)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});
  ctx.lineWidth=35*scale;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#d9d2ae';ctx.stroke();
  ctx.lineWidth=25*scale;ctx.strokeStyle='#eee8ce';ctx.stroke();
  // plaza
  const p=worldPoint(0,100);diamond(p.x,p.y,130*scale,65*scale,'#c8d9ad','#adc69d');
  diamond(p.x,p.y,95*scale,47*scale,'#d9e4bc');
 }
 function drawWater(){
  // decorative pond at upper left
  const p=worldPoint(-330,-155);ctx.save();ctx.translate(p.x,p.y);ctx.scale(scale,scale);
  diamond(0,0,115,44,'#8ec9c5','#69aaa8');diamond(0,-4,92,32,'#a9d9d1');
  for(let i=-2;i<=2;i++){ctx.strokeStyle='#ffffff80';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(i*22-15,-4+i*3);ctx.lineTo(i*22+15,-4+i*3);ctx.stroke()}
  ctx.restore()
 }
 function drawCharacter(){
  const p=worldPoint(state.x,state.y),s=scale;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
  const bob=state.moving?Math.sin(state.frame*.025)*2:Math.sin(state.frame*.008)*.8;
  ctx.translate(0,bob);
  ctx.fillStyle='#00000022';ctx.beginPath();ctx.ellipse(0,5,13,6,0,0,7);ctx.fill();
  // feet
  ctx.fillStyle='#314c55';ctx.fillRect(-8,-1,7,8);ctx.fillRect(2,-1,7,8);
  // body jacket
  ctx.fillStyle='#2f8269';ctx.beginPath();ctx.roundRect(-10,-22,20,22,6);ctx.fill();
  ctx.fillStyle='#e8f1dc';ctx.fillRect(-2,-20,4,15);
  // head
  ctx.fillStyle='#f1c9a5';ctx.beginPath();ctx.arc(0,-30,11,0,7);ctx.fill();
  // hair
  ctx.fillStyle='#344b4a';ctx.beginPath();ctx.arc(0,-35,11,Math.PI,Math.PI*2);ctx.lineTo(10,-30);ctx.lineTo(-10,-30);ctx.fill();
  // backpack
  ctx.fillStyle='#d5a34f';ctx.fillRect(8,-20,6,13);
  // direction marker
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(state.dir==='left'?-4:state.dir==='right'?4:0,-30,1.2,0,7);ctx.fill();
  ctx.restore()
 }
 function drawWorld(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#c7e3d8');bg.addColorStop(1,'#e8edcf');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // soft clouds
  for(let i=0;i<5;i++){const x=((i*237+state.frame*.08)%(W+180))-80,y=70+(i%3)*42;ctx.fillStyle='#ffffff48';ctx.beginPath();ctx.ellipse(x,y,35,10,0,0,7);ctx.ellipse(x+20,y-5,22,12,0,0,7);ctx.fill()}
  // ground diamond
  diamond(W/2,H/2+20,Math.min(W*.72,620*scale),Math.min(H*.58,350*scale),'#b5d59d','#a5c68f');
  drawWater();drawPath();
  // scattered grass dots
  for(let i=0;i<85;i++){const x=((i*137)%780)-390,y=((i*83)%560)-280,p=worldPoint(x,y);ctx.fillStyle=i%2?'#6eaa7755':'#f4f1c766';ctx.beginPath();ctx.arc(p.x,p.y,1.5*scale,0,7);ctx.fill()}
  // tree placement
  const trees=[[-360,-250],[-250,-270],[-100,-275],[100,-280],[280,-245],[370,-170],[350,30],[340,250],[180,275],[-40,280],[-280,260],[-390,100],[-360,-20],[-210,30],[90,-205],[-80,-185],[280,95],[-260,180]];
  trees.forEach((t,i)=>drawTree(t[0],t[1],i%3===0?1.15:.9));
  // small bushes
  [[-120,190],[110,230],[260,10],[-300,-100],[80,-260],[-190,-220]].forEach(v=>drawBush(v[0],v[1]));
  // sort by y for depth
  [...buildings].sort((a,b)=>a.y-b.y).forEach(drawBuilding);
  drawCharacter();
  // ambient label
  ctx.fillStyle='#3d725f';ctx.font=`bold ${10*scale}px sans-serif`;ctx.textAlign='center';
  const sign=worldPoint(-15,215);ctx.fillText('환경 마을 광장',sign.x,sign.y);
 }
 function nearestBuilding(){let best=null,dist=Infinity;for(const b of buildings){const d=Math.hypot(state.x-b.x,state.y-b.y);if(d<78&&d<dist){best=b;dist=d}}return best}
 function openBuilding(b){
  if(!b)return;
  state.modal=b;document.getElementById('modalEmoji').textContent=b.emoji;document.getElementById('modalKicker').textContent=b.kicker;
  document.getElementById('modalTitle').textContent=b.name;document.getElementById('modalText').textContent=b.desc;
  document.getElementById('moreBtn').onclick=()=>{closeModal();if(b.url && b.url!=='#')showToast('실제 재단 페이지 URL을 연결해 주세요.')};
  backdrop.classList.add('open');
 }
 function closeModal(){backdrop.classList.remove('open');state.modal=null}
 document.getElementById('closeModal').onclick=closeModal;document.getElementById('backBtn').onclick=closeModal;
 backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal()});
 document.getElementById('helpBtn').onclick=()=>{showToast('방향키 또는 WASD로 이동 · SPACE/ENTER로 건물 살펴보기')};
 function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600)}
 const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
 addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(state.modal){if(e.key==='Escape')closeModal();return}
  if(keyMap[e.key])state.keys[keyMap[e.key]]=true;
  if(e.key===' '||e.key==='Enter'){if(state.near)openBuilding(state.near)}
 });
 addEventListener('keyup',e=>{if(keyMap[e.key])state.keys[keyMap[e.key]]=false});
 addEventListener('blur',()=>{state.keys={}});
 document.querySelectorAll('.dpad button').forEach(btn=>{
  const dir=btn.dataset.dir;
  btn.addEventListener('pointerdown',e=>{e.preventDefault();state.keys[dir]=true;btn.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>state.keys[dir]=false));
 });
 function update(dt){
  if(!state.modal){
   let dx=0,dy=0;
   if(state.keys.left)dx-=1;if(state.keys.right)dx+=1;if(state.keys.up)dy-=1;if(state.keys.down)dy+=1;
   state.moving=!!(dx||dy);
   if(state.moving){const len=Math.hypot(dx,dy);dx/=len;dy/=len;const speed=145*dt;state.x+=dx*speed;state.y+=dy*speed;state.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
   state.x=Math.max(-390,Math.min(390,state.x));state.y=Math.max(-300,Math.min(300,state.y));
  }else state.moving=false;
  state.near=nearestBuilding();
  if(state.near){hint.classList.add('show');guideTitle.textContent=state.near.name+'에 도착했어요';guideText.textContent='SPACE 또는 ENTER를 눌러 이 공간의 사업 이야기를 확인하세요.'}
  else{hint.classList.remove('show');guideTitle.textContent='탐험을 시작해 보세요!';guideText.textContent='방향키 또는 WASD로 캐릭터를 움직여 건물 가까이 가보세요.'}
  // Camera follows character with smooth easing
  const p=iso(state.x,state.y);camX+=(p.x-camX)*Math.min(1,dt*4);camY+=(p.y-camY)*Math.min(1,dt*4);
 }
 function loop(t){const dt=Math.min((t-state.last)/1000||0,.04);state.last=t;state.frame=t;update(dt);drawWorld();requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
})();
</script>
</body>
